#:schema https://mise.en.dev/schema/mise.json

[settings]
dotfiles.root = "{{ config_source | canonicalize | dirname | dirname | dirname }}"
idiomatic_version_file_enable_tools = ["node", "pnpm", "npm"]
auto_env = true

[dotfiles]
# The mise directory is linked by bootstrap --config-dir.
"~/.config/git" = { mode = "symlink-each" }
"~/.config/zsh" = { mode = "symlink-each" }
"~/.config/starship.toml" = { mode = "symlink" }
