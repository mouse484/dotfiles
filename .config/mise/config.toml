#:schema https://mise.en.dev/schema/mise.json

min_version = { hard = "2026.6.6", soft = "2026.11.5" }

[settings]
dotfiles.root = "~/dotfiles"
idiomatic_version_file_enable_tools = ["node", "pnpm", "npm"]
auto_env = true

[dotfiles]
"~/.config/" = { source = "~/dotfiles/.config/", mode = "symlink-each" }
"~/.config/git/credential.config" = { source = "~/dotfiles/.config/git/credential.config.tera", mode = "template" }
"~/.zshenv/zdotdir" = { line = 'export ZDOTDIR="$HOME/.config/zsh"; source "$ZDOTDIR/.zshenv"' }

[bootstrap.repos]
"~/dotfiles" = { url = "https://github.com/mouse484/dotfiles.git" }
