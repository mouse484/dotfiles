#:schema https://mise.en.dev/schema/mise.json

[settings]
dotfiles.root = "~/src/github.com/mouse484/dotfiles"
idiomatic_version_file_enable_tools = ["node", "pnpm", "npm"]
auto_env = true

[dotfiles]
"~/.config/" = { source = "~/src/github.com/mouse484/dotfiles/.config/", mode = "symlink-each" }
"~/.zshenv/zdotdir" = { line = 'export ZDOTDIR="$HOME/.config/zsh"; source "$ZDOTDIR/.zshenv"' }

[bootstrap.repos]
"~/src/github.com/mouse484/dotfiles" = { url = "https://github.com/mouse484/dotfiles.git" }
